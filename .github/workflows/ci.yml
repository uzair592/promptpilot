name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "10.34.6"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build frontend
        env:
          BACKEND_ORIGIN: https://api.example.invalid
        run: pnpm --filter @promptpilot/frontend build

      - name: Check formatting
        run: >-
          pnpm exec prettier --check .github/workflows/ci.yml README.md
          apps/backend/README.md apps/frontend/README.md
          docs/production-deployment.md render.yaml package.json
          playwright.config.ts tests/acceptance/run.mjs
          apps/frontend/next.config.ts apps/frontend/lib/auth.ts
          apps/frontend/lib/conversations.ts apps/frontend/lib/projects.ts
          apps/frontend/app/dashboard/page.tsx apps/frontend/app/login/page.tsx
          apps/frontend/app/register/page.tsx
          "apps/frontend/app/projects/[projectId]/page.tsx"
          tests/frontend-auth.test.ts tests/frontend-conversations.test.ts
          tests/frontend-projects.test.ts

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend development dependencies
        working-directory: apps/backend
        run: python -m pip install --editable ".[dev]"

      - name: Full backend test suite
        working-directory: apps/backend
        run: python -m pytest -q

      - name: Ruff
        working-directory: apps/backend
        run: python -m ruff check src tests

      - name: Strict mypy
        working-directory: apps/backend
        run: python -m mypy --strict src

      - name: Smoke-test documented Uvicorn startup
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="promptpilot-ci-") as temporary:
              database = Path(temporary, "smoke.db")
              log_path = Path(temporary, "uvicorn.log")
              environment = os.environ.copy()
              environment["DATABASE_URL"] = f"sqlite:///{database}"
              environment["PYTHONPATH"] = "src"
              with log_path.open("w+", encoding="utf-8") as log:
                  server = subprocess.Popen(
                      [
                          sys.executable,
                          "-m",
                          "uvicorn",
                          "promptpilot_backend.main:app",
                          "--host",
                          "127.0.0.1",
                          "--port",
                          "8130",
                      ],
                      cwd="apps/backend",
                      env=environment,
                      stdout=log,
                      stderr=subprocess.STDOUT,
                  )
                  succeeded = False
                  try:
                      deadline = time.monotonic() + 30
                      while time.monotonic() < deadline:
                          if server.poll() is not None:
                              raise RuntimeError(
                                  f"Uvicorn exited early with status {server.returncode}"
                              )
                          try:
                              with urllib.request.urlopen(
                                  "http://127.0.0.1:8130/docs", timeout=2
                              ) as response:
                                  if response.status != 200:
                                      raise RuntimeError(
                                          f"Unexpected /docs status: {response.status}"
                                      )
                                  print("Uvicorn startup smoke passed: /docs returned 200")
                                  succeeded = True
                                  break
                          except (urllib.error.URLError, TimeoutError):
                              time.sleep(0.25)
                      if not succeeded:
                          raise TimeoutError("Uvicorn /docs endpoint did not become ready")
                  finally:
                      if server.poll() is None:
                          server.terminate()
                          try:
                              server.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              server.kill()
                              server.wait(timeout=10)
                      if not succeeded:
                          log.flush()
                          print(log_path.read_text(encoding="utf-8"), file=sys.stderr)
          PY

  browser-acceptance:
    name: Browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "10.34.6"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend development dependencies
        working-directory: apps/backend
        run: python -m pip install --editable ".[dev]"

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run persistent-workflow acceptance test
        id: acceptance
        env:
          PYTHON: python
        run: pnpm test:e2e

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5

  production-readiness:
    name: Production install and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promptpilot
          POSTGRES_USER: promptpilot
          POSTGRES_PASSWORD: promptpilot-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptpilot -d promptpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install production dependencies only
        working-directory: apps/backend
        run: python -m pip install .

      - name: Apply and verify PostgreSQL migrations
        working-directory: apps/backend
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://promptpilot:promptpilot-ci-only@localhost:5432/promptpilot
          CORS_ORIGINS: https://promptpilot.example
          STORAGE_PATH: ${{ runner.temp }}/promptpilot-ci-storage
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Smoke-test production startup and health endpoints
        working-directory: apps/backend
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://promptpilot:promptpilot-ci-only@localhost:5432/promptpilot
          CORS_ORIGINS: https://promptpilot.example
          STORAGE_PATH: ${{ runner.temp }}/promptpilot-ci-storage
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          server = subprocess.Popen(
              [
                  sys.executable,
                  "-m",
                  "uvicorn",
                  "promptpilot_backend.main:app",
                  "--host",
                  "127.0.0.1",
                  "--port",
                  "8133",
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          succeeded = False
          try:
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  if server.poll() is not None:
                      raise RuntimeError(
                          f"Uvicorn exited early with status {server.returncode}"
                      )
                  try:
                      for path in ("/healthz", "/readyz"):
                          with urllib.request.urlopen(
                              f"http://127.0.0.1:8133{path}", timeout=3
                          ) as response:
                              if response.status != 200:
                                  raise RuntimeError(
                                      f"Unexpected {path} status: {response.status}"
                                  )
                      print("Production startup smoke passed: /healthz and /readyz returned 200")
                      succeeded = True
                      break
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(0.25)
              if not succeeded:
                  raise TimeoutError("Production health endpoints did not become ready")
          finally:
              if server.poll() is None:
                  server.terminate()
                  try:
                      server.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait(timeout=10)
              if not succeeded and server.stdout is not None:
                  print(server.stdout.read(), file=sys.stderr)
          PY
