[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpilot-backend"
version = "0.1.0"
description = "PromptPilot FastAPI backend boundary"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26",
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/promptpilot_backend/analyzer_service.py" = ["E501"]
"src/promptpilot_backend/analysis_routes.py" = ["E501"]
"src/promptpilot_backend/models.py" = ["E501"]
"src/promptpilot_backend/analyzer_v2.py" = ["E501"]
"src/promptpilot_backend/llm_provider.py" = ["E501"]
"tests/test_analyzer_v2.py" = ["E501"]
"src/promptpilot_backend/question_routes.py" = ["E501"]
"src/promptpilot_backend/question_service.py" = ["E501"]
"src/promptpilot_backend/question_generator.py" = ["E501"]
"src/promptpilot_backend/memory_service.py" = ["E501"]
"src/promptpilot_backend/memory_routes.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["promptpilot_backend"]
