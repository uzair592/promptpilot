databases:
  - name: promptpilot-postgres
    databaseName: promptpilot
    user: promptpilot
    plan: 0.1c-256mb
    region: oregon

services:
  - type: web
    name: promptpilot-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    rootDir: apps/backend
    buildCommand: python -m pip install .
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn promptpilot_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    disk:
      name: promptpilot-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: promptpilot-postgres
          property: connectionString
      - key: STORAGE_PATH
        value: /var/data/promptpilot
      - key: SESSION_COOKIE_NAME
        value: promptpilot_session
      - key: CORS_ORIGINS
        sync: false
